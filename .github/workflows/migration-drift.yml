# Is every migration in the repo on the live project?
#
# CI tests migrations; a merge applies them only once approved
# (docs/migrations.md). A
# migration merged and never applied looks exactly like one that ran,
# until a screen asks for a column that is not there — and a merge has
# silently dropped an applied migration from the tree before. This job
# turns either into a red run. It only reads: one `select` on the
# project's migration history, compared with `supabase/migrations` by
# `data/scripts/migration-drift.mjs` — version for version, both ways,
# since the history was repaired on 25 Nov 2026. What each kind of
# failure means, and what to do about it, is written there.
#
# When it runs:
# - After a merge that touches `supabase/migrations/`. Merge comes before
#   apply in this repo, so this run waits: it asks again every 2 minutes
#   for 30, and goes green by itself once the migration has been
#   applied. Red after 30 minutes means it was not.
# - Every day, once, for drift that came from elsewhere (a migration
#   rolled back, a file deleted by a merge).
# - By hand: Actions → Migration drift → Run workflow.
#
# Needs the `SUPABASE_ACCESS_TOKEN` secret the function deploys already
# use; skipped, green, without it.

name: Migration drift

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

concurrency:
  group: migration-drift
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_REF: amdvitzpogaejzzqroco
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Skip when SUPABASE_ACCESS_TOKEN is not configured
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "No SUPABASE_ACCESS_TOKEN secret — skipping."

      - uses: actions/checkout@v5
        if: env.SUPABASE_ACCESS_TOKEN != ''

      - uses: actions/setup-node@v5
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          node-version: 22

      - name: Compare the repo with the live history
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          set -uo pipefail
          # One try for the daily and manual runs; fifteen, two minutes
          # apart, after a merge (see the header).
          if [ "${{ github.event_name }}" = "push" ]; then tries=15; else tries=1; fi
          for i in $(seq 1 "$tries"); do
            # A 5xx is the API, not the history: the first merge this job
            # saw (25 Nov 2026) went red on one 502 and was green a minute
            # later. Three asks, 20 seconds apart, before calling it.
            for ask in 1 2 3; do
              code=$(curl -sS -o /tmp/live.json -w '%{http_code}' \
                -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H 'Content-Type: application/json' \
                -d '{"query":"select version, name from supabase_migrations.schema_migrations order by version"}')
              case "$code" in 5*) echo "The API answered $code; asking again in 20 seconds."; sleep 20;; *) break;; esac
            done
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "The project answered $code:"; head -c 500 /tmp/live.json; echo
              exit 2
            fi
            # In an `if`, because GitHub runs this with `bash -e`: a bare command
            # that exits 1 ends the step on the spot, before `$?` is read. It did —
            # the first merge with a migration waiting (#1645, 25 Nov 2026) went
            # red in seven seconds instead of waiting thirty minutes.
            if node data/scripts/migration-drift.mjs /tmp/live.json; then status=0; else status=$?; fi
            # 0: all on live. 2: the answer could not be read — waiting
            # will not fix that. 1: something not applied yet.
            if [ "$status" -ne 1 ] || [ "$i" -eq "$tries" ]; then exit "$status"; fi
            echo "Not applied yet; asking again in 2 minutes ($i of $tries)."
            sleep 120
          done
