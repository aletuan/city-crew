# Publishes the Expo app as an EAS Update whenever app/ changes on main,
# so the latest build can be opened in Expo Go from the expo.dev project
# page — no laptop in the loop.
#
# One-time setup (optional — without it this workflow skips gracefully):
#   1. Create a free account at https://expo.dev
#   2. expo.dev → Account settings → Access tokens → create a token
#   3. Repo → Settings → Secrets and variables → Actions → Secrets:
#        EXPO_TOKEN = <the token>
#
# Local alternative (needs a computer): cd app && npx expo start,
# then scan the QR with Expo Go.
#
# ── why --environment is on the update command ──
#
# `eas update` builds a fresh public manifest from `app.config.js`, and
# that manifest is what `Constants.expoConfig` returns on a phone once the
# update lands — it replaces the one baked into the binary. So anything
# the config reads from the environment has to be present *here*, at
# publish time, not only at build time.
#
# `extra.hasGoogleMapsIosKey` is exactly that: false without
# GOOGLE_MAPS_IOS_KEY, and `MiniMap` hides the map when it is false. A
# publish without the variable therefore switched the map off on installs
# whose binary had the SDK linked and the key in its Info.plist.
#
# The variable lives in EAS, not in GitHub's secrets, and eas-cli only
# fetches it when told which environment to read: "Required for projects
# using Expo SDK 55 or greater," says `eas update --help`. Without the
# flag it loads nothing and says nothing about it.

# ── why app.json names its platforms ──
#
# `--platform=all` below does not mean "the platforms this app targets". It
# means "every platform the CLI finds support for", and web counts as
# supported the moment `react-native-web` is present in node_modules — which
# it now is, as a devDependency of the test harness. Adding it turned on a
# web bundle that has never been buildable: `react-native-maps` imports React
# Native internals, which is an error on web, and MiniMap is reachable from
# the Ideas screen.
#
# So `app.json` states the two platforms this app actually ships to, and the
# export follows that rather than following whatever happens to be installed.
# The deploy that broke is the one this note exists to explain: iOS and
# Android had both bundled to 97% when the web bundle failed the whole run.

name: Publish app preview

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-preview.yml'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Skip when EXPO_TOKEN is not configured
        if: env.EXPO_TOKEN == ''
        run: echo "No EXPO_TOKEN secret — skipping EAS publish. See the header of this workflow file for setup."
      - uses: actions/setup-node@v5
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        if: env.EXPO_TOKEN != ''
        working-directory: app
      - name: Publish EAS Update
        if: env.EXPO_TOKEN != ''
        working-directory: app
        env:
          # Via env, not inline template substitution: a multi-line or quoted
          # commit message would break the shell command (and is injectable).
          COMMIT_MSG: ${{ github.event.head_commit.message || 'manual run' }}
        run: |
          npx eas-cli@latest init --non-interactive --force
          npx eas-cli@latest update:configure --non-interactive
          MSG="$(printf '%s' "$COMMIT_MSG" | head -n1)"
          npx eas-cli@latest update --branch main --environment production --message "$MSG" --non-interactive
