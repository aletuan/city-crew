# Typecheck and unit tests for the app.
#
# Until this existed the only automated gate was whether the bundle built
# during `eas update` — and TypeScript is erased before bundling, so a type
# error shipped. Runs on every pull request and every push to main, so a
# red mark appears before a merge rather than after one.
#
# Everything here runs in a plain Node process: no simulator, no Supabase.
# The pure modules are tested as functions (see `app/src/lib/place.ts` for
# why that is possible and what keeps it that way); the screens and
# components are rendered through `react-native-web` into jsdom and driven
# (see `app/src/uitest/setup.tsx` for what that substitution is worth).
# The one suite that needs a real device — the Maestro flows under
# `app/.maestro/` — runs by hand on a Mac and is not here; see its README.

name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The questions the typecheck structurally cannot ask: a hook called
      # conditionally, a dependency array that has gone stale, an import that
      # resolves to nothing. `--max-warnings=0`, so there is no third state
      # between "this may land" and "this may not" — see app/eslint.config.js
      # for the rules and for the 24 places that carry a documented exception.
      - if: '!cancelled()'
        run: npm run lint
      # Runs even when the typecheck failed: two red steps say more about
      # what broke than one red step and one skipped.
      - if: '!cancelled()'
        run: npm test
      # The same suite on a clock that has daylight saving. Hanoi does not,
      # so the run above structurally cannot catch a DST bug — and it did
      # not: a `daysBetween` that subtracted two local noons returned 1.958
      # days across the US spring-forward and stayed green here.
      #
      # The reader this protects is the one in New York planning a week in
      # Hanoi, whose phone is on New York time.
      - if: '!cancelled()'
        run: npm run test:tz
      # The same suite again, with floors under it. Not to measure what is
      # covered but to stop it eroding: a function added without a test
      # turns this step red, and nothing else in this repository would
      # notice.
      #
      # Three floors, each per file — see `vitest.config.ts` for the
      # numbers and the reasoning. `src/lib/**/*.ts` is held at 100 in
      # every column, because either the pure half is covered or it is
      # not. `src/screens/*.tsx` and `src/components/*.tsx` each carry a
      # ratchet: the figures the lowest screen or component stood at when
      # its tests last grew, rounded down, raised by hand and never
      # lowered. A green step means the arithmetic is held and every
      # screen still has the tests it had. It still says nothing about how
      # any of it looks: layout is not simulated, and no assertion here
      # has ever seen a pixel.
      - if: '!cancelled()'
        run: npm run coverage

  # Does it still bundle?
  #
  # The job above runs the app's code without ever building the app, which
  # is a gap with a name on it now: #325 added `react-native-web` as a
  # devDependency of the test harness, every check here went green, and the
  # EAS publish on main then failed — `--platform=all` had quietly grown a
  # web target, and `react-native-maps` imports React Native internals,
  # which is an error on web. Typecheck cannot see that. Neither can a test
  # that imports a module rather than bundling it.
  #
  # So this runs Metro over the whole graph, for every platform the app
  # declares, and fails if any of them cannot be built.
  #
  # `--platform all` on purpose, rather than naming ios and android here.
  # "All" is resolved from `app.json`'s `platforms`, so this job is also
  # what holds that declaration in place: drop it and the web target comes
  # back, and this goes red before a deploy does.
  #
  # No EXPO_TOKEN and no network account: `expo export` bundles locally and
  # publishes nothing, so it runs on a fork's pull request like any other
  # check. Output goes outside the checkout because nothing here keeps it.
  #
  # ── and does it still hold together? ──
  #
  # The step before the export asks a question the export cannot: are the
  # dependency versions the ones this SDK's native runtime was built
  # against. That is the second thing to have broken the app silently, and
  # it broke it worse than the first. `react-native-web`, added for the test
  # harness, pulls `react-dom`, which requires `react@^19.2.8` — and
  # `"react": "^19.1.0"` let npm take it. SDK 54 pins 19.1.0, so a
  # reconciler newer than the renderer shipped: no crash and no red box, the
  # first frame simply never committed and the app held its holding frame
  # forever. A white screen on launch, and nothing in CI could see it —
  # typecheck, lint, 1,274 tests, 100% coverage and a clean bundle all
  # passed on the version that did it.
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Reads the SDK's own bundled-native-modules list and fails on any
      # dependency that has drifted off it. Needs the Expo API, which a
      # runner has and a sandbox does not.
      - run: npx expo install --check
      - if: '!cancelled()'
        run: npx expo export --platform all --output-dir "$RUNNER_TEMP/expo-export"

  # The dashboard, same doctrine as the app job, in two halves.
  #
  # The modules first: plain functions (or, for api.js, a faked Supabase
  # client — see tests/_fakeSupabase.mjs) under `node --test`, no React,
  # no network. Started as just the Contributors screen's arithmetic — the
  # aggregation every corner of that page reads from (see
  # dashboard/src/contributors.js) — and grew to cover api.js, the desk's
  # whole write path to Supabase, and auth.jsx's login-gate decision
  # (dashboard/src/lib/authGate.js).
  #
  # Then the components, which `node --test` could never load: rendered
  # into jsdom by vitest and driven, every screen inside the real App
  # shell at its real route — see dashboard/tests/_ui/desk.jsx. For months
  # the README beside them said "everything in src/components/ is
  # untested", and the only gate that mentioned them was a function
  # percentage that fell every time the desk gained a feature.
  #
  # This job ran without an `npm ci` until lint arrived: `node --test` finds
  # dashboard/tests/ on its own and the modules under test import nothing
  # outside the repo. ESLint is a dependency, so the install is now real —
  # and it buys the thing this package most lacked, since it is plain
  # JavaScript with no typecheck standing behind it.
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - if: '!cancelled()'
        run: npm test
      # A ratchet, not a target — same idea as the app job's coverage step.
      #
      # Measured by c8 rather than Node's built-in reporter, and the reason
      # is the denominator. `tests/api.test.mjs` re-imports `api.js` under a
      # fresh query string per test, and V8 reports coverage per URL; the
      # built-in reporter counted every `api.js?t=N` as its own file, and
      # the enforced total was whatever the process happened to load — so
      # adding a test could *lower* the number (#613 measured 69.57% →
      # 68.18% for one new test), and "functions 11%" was an artefact of
      # the split, not a fact about the tests. c8 folds the re-imports back
      # into one `api.js`, and `--all --src src` fixes the denominator at
      # every `src/**/*.js` whether a test loaded it or not.
      #
      # `--per-file`, so a regression in a module at 100% cannot hide
      # behind slack in another. Lines and functions are gated; branches
      # are not, because V8 reports branches only inside functions it saw
      # run, which makes that one denominator move with the tests no
      # matter how the files are counted. Three files are excluded by
      # name: `categories.js` and `vibes.js` are taxonomy tables read by
      # the React screens, with no statement worth executing in a Node
      # test; `lib/supabase.js` is the client itself — the same exception
      # the app's gate makes for its `supabase.ts` — whose only branches
      # are on environment variables, and a runner with none set covers a
      # different set of lines than a laptop with a `.env` (80% on CI,
      # 86% locally, for the same file and the same tests).
      #
      # The floors are today's real figures rounded down — api.js at 83.5
      # lines / 51.3 functions is the lowest file and sets both. Raise them
      # by hand, in the same change, whenever coverage goes up — never
      # lower them to make a change pass.
      - if: '!cancelled()'
        run: npm run coverage
      # The components, rendered. Same two steps as the app: the suite, then
      # the suite again under a per-file floor (see dashboard/vitest.config.js
      # for the numbers and what they are for).
      - if: '!cancelled()'
        run: npm run test:ui
      - if: '!cancelled()'
        run: npm run coverage:ui

  # The data scripts: plain JavaScript with nothing else reading them, now
  # all frozen bootstrap pipelines kept for provenance — the mockup they
  # fed is gone (cc5d64f). `npm test` here runs no tests as a result;
  # lint is what this job still holds, and it is the only automated reader
  # these scripts have. Delete the job, or give it something to test, but
  # do not leave a green test step that asserts nothing without saying so.
  data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: data/package-lock.json
      - run: npm ci
      - run: npm run lint
      - if: '!cancelled()'
        run: npm test

  # The migrations, run against a real Postgres and then asserted. The app
  # job above cannot reach any of this: triggers, constraints and backfills
  # are SQL, and SQL that has only been read is SQL that has not been run.
  #
  # Not a Supabase stack — see supabase/tests/_harness.sql for what is
  # stubbed and what that leaves untested.
  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: tester
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y --no-install-recommends postgresql-client
      - run: supabase/tests/run.sh
        env:
          PG_URL: postgres://tester:tester@localhost:5432
