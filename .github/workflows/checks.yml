# Typecheck and unit tests for the app.
#
# Until this existed the only automated gate was whether the bundle built
# during `eas update` — and TypeScript is erased before bundling, so a type
# error shipped. Runs on every pull request and every push to main, so a
# red mark appears before a merge rather than after one.
#
# The tests are pure functions in a plain Node process: no React Native, no
# simulator, no Supabase. See `app/src/lib/place.ts` for why that is
# possible and what keeps it that way.

name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Runs even when the typecheck failed: two red steps say more about
      # what broke than one red step and one skipped.
      - if: '!cancelled()'
        run: npm test
      # The same suite on a clock that has daylight saving. Hanoi does not,
      # so the run above structurally cannot catch a DST bug — and it did
      # not: a `daysBetween` that subtracted two local noons returned 1.958
      # days across the US spring-forward and stayed green here.
      #
      # The reader this protects is the one in New York planning a week in
      # Hanoi, whose phone is on New York time.
      - if: '!cancelled()'
        run: npm run test:tz
      # The same suite again, with a floor under it. Not to measure what is
      # covered — every pure module is already at 100% — but to stop that
      # eroding: a function added to `src/lib` without a test turns this
      # step red, and nothing else in this repository would notice.
      #
      # Scoped to `src/lib/*.ts`, which is about 9% of the app's
      # statements. The other 91% is components and screens, which no
      # runner here can load. A green step means the arithmetic is held and
      # says nothing about how any of it looks — see `vitest.config.ts`.
      - if: '!cancelled()'
        run: npm run coverage

  # The dashboard's pure modules, same doctrine as the app job: plain
  # functions in a plain Node process, no React, no Supabase, no install.
  # Today that is the Contributors screen's arithmetic — the aggregation
  # every corner of that page reads from (see dashboard/src/contributors.js).
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # `node --test` discovers dashboard/tests/ on its own; the modules
      # under test import nothing outside the repo, so there is no npm ci.
      - run: node --test

  # The migrations, run against a real Postgres and then asserted. The app
  # job above cannot reach any of this: triggers, constraints and backfills
  # are SQL, and SQL that has only been read is SQL that has not been run.
  #
  # Not a Supabase stack — see supabase/tests/_harness.sql for what is
  # stubbed and what that leaves untested.
  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: tester
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y --no-install-recommends postgresql-client
      - run: supabase/tests/run.sh
        env:
          PG_URL: postgres://tester:tester@localhost:5432
