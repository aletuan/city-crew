# Builds the iOS app on EAS and sends it to TestFlight, without a laptop.
#
# The other app workflow, `app-preview.yml`, publishes an EAS Update on
# every merge that touches `app/`. That covers most changes, because most
# changes are JavaScript and an update reaches an installed build in
# seconds. It cannot cover the rest: a new native module, a config plugin,
# an SDK bump, a new permission string. Those live in the binary, and a
# binary comes from `eas build`. Until this file existed that step was a
# person at a terminal, and the two builds it took to get Google Maps
# linked were both run by hand.
#
# ── why this does not run on every merge ──
#
# Because a build is not free and a submission is not private. Each run
# spends EAS build time, adds a build to App Store Connect, and can notify
# every tester on the internal group. Merging JavaScript twenty times a
# day must not do any of that — the update workflow already carries those
# changes, correctly and for nothing.
#
# So the trigger is deliberate: push a tag, or press the button. Nothing
# here fires on its own.
#
#   git tag v1.0.2 && git push origin v1.0.2
#
# or Actions → Release app to TestFlight → Run workflow.
#
# ── the two profiles, and why the choice is here ──
#
# `production` is the App Store build and what a tag push makes.
# `preview` is the same release binary with a different channel stamped
# into it, and the stamp is the whole difference: `lib/channel` reads it,
# and the diagnostics that must never run for a reader — the launch
# waterfall, the deck's timeline — ask it before recording anything.
#
# So a number measured on a production build cannot be measured at all,
# and one measured on a dev client is measured on unoptimised JavaScript.
# `preview` is the only build that is both honest about speed and allowed
# to say what it saw. Making one is a deliberate act, which is why it is
# an input rather than a second workflow.
#
# Both submit through the `production` submit profile: there is one app
# in App Store Connect and `eas.json` carries its id once.
#
# The tag is a name for the release, not a version: the version comes from
# `app.json`, and the build number from EAS, which holds it remotely and
# increments it per build (`appVersionSource: remote`, `autoIncrement` on
# the production profile in `eas.json`). Tag and version agreeing is a
# courtesy to whoever reads the tag list later, and nothing checks it.
#
# ── bump `version` after every App Store release ──
#
# A build number is not enough. Apple keeps a pre-release train per
# `CFBundleShortVersionString`, and approving that version on the App
# Store closes its train for good: every later upload under it is
# refused, whatever its build number.
#
#   Invalid Pre-Release Train. The train version '1.0.3' is closed for
#   new build submissions (409)
#
# That is what happened to 1.0.3 (21), the first `preview` build. EAS
# incremented 20 → 21 and built it fine; App Store Connect refused the
# upload because 1.0.3 was already live. `autoIncrement` cannot see this
# — it counts builds, and the train is about the version.
#
# So `app.json` moves to the next patch as soon as a release is
# approved, and every TestFlight build after that — diagnostic ones
# included — rides the open train. The refusal costs a whole build, and
# it arrives at submit time, minutes after the build everybody already
# paid for.
#
# ── why it does not wait ──
#
# `--no-wait` returns as soon as EAS has the job. A queued build on the
# free plan can sit for a long time before it starts, and a runner held
# open through that queue bills for waiting rather than for working. The
# submission is scheduled on EAS at the same time and runs there when the
# build finishes, so nothing is lost by leaving: watch it on the build page
# this job prints, or in the mail EAS sends when it is done.
#
# The cost is that a red build is not a red check here. This job going
# green means "EAS accepted the job", not "there is a build in TestFlight".
#
# ── submitting a build that already exists ──
#
# `build_id` skips the build and submits one EAS already has. It is for
# the case this workflow first met: the build started, the submission did
# not, and rebuilding to fix the submission would pay twice for the same
# binary. The id is on the build's page, and in the line this job prints.
#
# ── what it needs ──
#
#   EXPO_TOKEN         repo secret, the same one `app-preview.yml` uses.
#   Apple credentials  already on EAS servers (distribution certificate,
#                      provisioning profile, and the App Store Connect API
#                      key that `eas submit` authenticates with).
#
# Without the token this workflow skips, the way the preview one does,
# rather than failing a fork or a clone that has no Expo project behind it.

name: Release app to TestFlight

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        type: choice
        default: ios
        options: [ios, android, all]
        required: true
      profile:
        description: 'Build profile — preview stamps the channel that lets diagnostics record'
        type: choice
        default: production
        options: [production, preview]
        required: true
      build_id:
        description: 'Submit this existing build instead of making a new one'
        type: string
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # A tag push has no inputs, so it picks the platform this app
      # actually ships through TestFlight, and the profile a release is.
      PLATFORM: ${{ inputs.platform || 'ios' }}
      PROFILE: ${{ inputs.profile || 'production' }}
    steps:
      - uses: actions/checkout@v5
      - name: Skip when EXPO_TOKEN is not configured
        if: env.EXPO_TOKEN == ''
        run: echo "No EXPO_TOKEN secret — skipping EAS build. See the header of this workflow file for setup."
      - uses: actions/setup-node@v5
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        if: env.EXPO_TOKEN != ''
        working-directory: app
      # `--auto-submit` uses the submit profile named after the build
      # profile, which is `production` in `eas.json`. That profile carries
      # `ascAppId`, because without it a non-interactive submission stops
      # to ask which App Store Connect app it is for and there is nobody
      # to answer. The Maps keys are not passed here: `eas build` reads
      # them from the EAS environment the production profile resolves to,
      # which is where they live.
      # `--auto-submit-with-profile` rather than `--auto-submit`, which
      # looks for a submit profile named after the *build* profile and
      # would find none for `preview`.
      - name: Build and submit
        if: env.EXPO_TOKEN != '' && inputs.build_id == ''
        working-directory: app
        run: |
          npx eas-cli@latest build \
            --profile "$PROFILE" \
            --platform "$PLATFORM" \
            --auto-submit-with-profile production \
            --no-wait \
            --non-interactive
      - name: Submit an existing build
        if: env.EXPO_TOKEN != '' && inputs.build_id != ''
        working-directory: app
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          npx eas-cli@latest submit \
            --profile production \
            --platform "$PLATFORM" \
            --id "$BUILD_ID" \
            --non-interactive
