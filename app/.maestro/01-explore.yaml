# Explore: the list renders real places, scrolls both ways, and the city
# can be switched and switched back.
appId: host.exp.Exponent
env:
  EXPO_URL: exp://127.0.0.1:8081
---
# Kill Expo Go first so every flow starts from a fresh bundle load on
# Explore, not from wherever the previous flow left the app.
- launchApp:
    stopApp: true
- openLink: ${EXPO_URL}
- extendedWaitUntil:
    visible:
      id: "tab-explore"
    timeout: 90000
- runFlow: common/dismiss-welcome.yaml
- runFlow: common/expo-go-prep.yaml
- tapOn:
    id: "tab-explore"
- extendedWaitUntil:
    visible:
      id: "place-card-0"
    timeout: 30000
- swipe:
    direction: UP
    duration: 600
- swipe:
    direction: DOWN
    duration: 600
- swipe:
    direction: DOWN
    duration: 600
- assertVisible:
    id: "explore-city"
# Rows in the city switcher are indexed A to Z (`lib/cityBook`); the
# second row is "some other city" whichever one is current. The way back
# to the default is by name, through the sheet's search, since the
# default (Saigon) is no longer the first row: later flows see the same
# data whatever the sheet's order becomes.
- tapOn:
    id: "explore-city"
- extendedWaitUntil:
    visible:
      id: "city-row-1"
    timeout: 10000
- tapOn:
    id: "city-row-1"
- extendedWaitUntil:
    visible:
      id: "place-card-0"
    timeout: 30000
- tapOn:
    id: "explore-city"
- extendedWaitUntil:
    visible:
      id: "city-search"
    timeout: 10000
- tapOn:
    id: "city-search"
- inputText: "saigon"
# Finish text entry before selecting a row. With the keyboard up, the
# recorded tap only dismissed it and moved the sheet, leaving the city
# unchanged. Submit the search to dismiss the keyboard; hideKeyboard's
# iOS gesture can dismiss this bottom sheet too. Reacquire the settled row.
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "city-row-0"
    timeout: 10000
- tapOn:
    id: "city-row-0"
- extendedWaitUntil:
    notVisible:
      id: "city-search"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "place-card-0"
    timeout: 30000
- assertVisible:
    id: "tab-explore"
