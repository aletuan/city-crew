# `maestro test .maestro` runs these, in this order. Files under common/
# are subflows and are only ever run through runFlow.
#
# 07-sign-up-delete.yaml is deliberately not in this list. See its own
# header and GUIDELINES.md ("iOS's own AutoFill panel") for why: it needs
# manual QA per release instead of a Maestro run.
flows:
  - "00-launch.yaml"
  - "01-explore.yaml"
  - "02-place-detail.yaml"
  - "03-search.yaml"
  - "04-sign-in.yaml"
  - "05-plan-trip.yaml"
  - "06-save-place.yaml"
  - "08-explore-filter.yaml"
  - "09-collections-browse.yaml"
  - "10-check-in.yaml"
  - "11-collection-crud.yaml"
  - "14-forgot-password.yaml"
  # Last: the language it picks persists on the device. See its header.
  - "12-language.yaml"
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - 00-launch
    - 01-explore
    - 02-place-detail
    - 03-search
    - 04-sign-in
    - 05-plan-trip
    - 06-save-place
    - 08-explore-filter
    - 09-collections-browse
    - 10-check-in
    - 11-collection-crud
    - 14-forgot-password
    - 12-language
