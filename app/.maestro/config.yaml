# `maestro test .maestro` runs these, in this order. Files under common/
# are subflows and are only ever run through runFlow.
flows:
  - "00-launch.yaml"
  - "01-explore.yaml"
  - "02-place-detail.yaml"
  - "03-search.yaml"
  - "04-sign-in.yaml"
  - "05-plan-trip.yaml"
  - "06-save-place.yaml"
  - "07-sign-up-delete.yaml"
  - "08-explore-filter.yaml"
  - "09-collections-browse.yaml"
  - "10-check-in.yaml"
  - "11-collection-crud.yaml"
  - "13-trip-edit.yaml"
  - "14-forgot-password.yaml"
  - "15-theme.yaml"
  - "16-trip-invite.yaml"
  - "17-unfriend.yaml"
  - "18-guest-save-resume.yaml"
  - "19-collection-privacy.yaml"
  - "20-guest-trip-resume.yaml"
  # Last: the language it picks persists on the device. See its header.
  - "12-language.yaml"
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - 00-launch
    - 01-explore
    - 02-place-detail
    - 03-search
    - 04-sign-in
    - 05-plan-trip
    - 06-save-place
    - 07-sign-up-delete
    - 08-explore-filter
    - 09-collections-browse
    - 10-check-in
    - 11-collection-crud
    - 13-trip-edit
    - 14-forgot-password
    - 15-theme
    - 16-trip-invite
    - 17-unfriend
    - 18-guest-save-resume
    - 19-collection-privacy
    - 20-guest-trip-resume
    - 12-language
