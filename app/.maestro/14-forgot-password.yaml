# Forgot password, as far as a flow can honestly go: ask for a recovery
# code, and reach the step that takes it.
#
# The address is not the test account's, on purpose. That account is a
# real Gmail address, and every run would post a live recovery code into
# a mailbox nobody here reads — a code that resets the account the
# signed-in flows depend on. `example.com` is reserved (RFC 2606) and
# takes no mail; Supabase answers a recovery request for an address it
# has no account for exactly as it answers one it has, so the request is
# a real round trip to auth and nothing is sent.
#
# What it does not reach: the server refusing a wrong code. That needs a
# new password typed first, and the new-password field raises iOS's own
# "Use Strong Password?" panel — the one GUIDELINES.md ("Manual QA") says
# Maestro cannot drive. Tried on 10 October: the panel swallowed all but
# one character and sat over the Reset button. So the last check is the
# form's own refusal of an empty code, which needs no password and keeps
# the reader on the step.
#
# Nothing to clean up: no mail, no account, no password changed.
appId: host.exp.Exponent
env:
  EXPO_URL: exp://127.0.0.1:8081
  RESET_EMAIL: maestro-reset@example.com
---
- runFlow: common/start.yaml
- runFlow: common/ensure-signed-out.yaml
- tapOn:
    id: "profile-sign-in"
- extendedWaitUntil:
    visible:
      id: "signin-forgot"
    timeout: 15000
- tapOn:
    id: "signin-forgot"

# The address.
- extendedWaitUntil:
    visible:
      id: "forgot-email"
    timeout: 10000
- tapOn:
    id: "forgot-email"
- inputText: ${RESET_EMAIL}
- hideKeyboard
- tapOn:
    id: "forgot-submit"

# The code step: reached only once auth has answered the request, and the
# resend link starts out waiting.
- extendedWaitUntil:
    visible:
      id: "forgot-code"
    timeout: 20000
- assertVisible:
    id: "forgot-resend"
- assertNotVisible:
    id: "auth-error"

# Reset with no code: the form says so and keeps the reader on the step.
- tapOn:
    id: "forgot-reset"
- extendedWaitUntil:
    visible:
      id: "auth-error"
    timeout: 10000
- assertVisible:
    id: "forgot-code"
