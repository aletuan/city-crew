# The theme follows the account (12 Oct 2026): a choice made signed in is
# the account's, a guest's choice is the device's, and signing back in
# puts the account's on again — the account's, not the last person's on
# this phone, whether that was a guest or another account.
#
# Two accounts: TEST_EMAIL (A) and TEST_EMAIL_2 (B, the Keychain's
# `citycrew-maestro-2`). A guest alone cannot tell "the account's theme
# was read" from "the device's was kept" once a sign-out leaves the
# device on the account's choice; a second account with a different
# choice can. B is on Light and this flow never changes it: if B ever
# signs in to Dark, A's theme leaked through the device, or a sign-in
# wrote the device's theme over B's (B was set once, by hand, on 12
# October; reset it with `pick-theme` light signed in as B).
#
# Grounds only — Light, Dark, Auto. A look is a restart, and Expo Go
# refuses `reloadAsync` (the sheet then shows "Close and reopen"), so the
# looks are checked by hand on a TestFlight build. The grounds take the
# same path through the account, which is what this flow is for.
#
# Every step is read off a tick, never a colour: Maestro cannot see a
# colour, and the tick is what the sheet says it put on. The tick is read
# in the row's label, not by `theme-<id>-on` — see `common/pick-theme.yaml`.
#
# Not covered: an account that never chose. It takes the device's theme
# on its first sign-in (lib/themeAccountSync, rule 4) and from then on
# has chosen, so only a fresh account each run could check it — and the
# sign-up form is what Maestro cannot drive (07-sign-up-delete).
#
# Leaves A on Auto and the device signed out, which is how the flows after
# it expect to find things.
appId: host.exp.Exponent
env:
  EXPO_URL: exp://127.0.0.1:8081
---
- runFlow: common/start.yaml
# Explicitly select A. The old ensure-signed-in helper kept any session;
# on 12 October a run took B for A and changed B to Dark. The shared
# helper now also signs in explicitly and verifies the actual email.
- runFlow: common/ensure-signed-out.yaml
- tapOn:
    id: "profile-sign-in"
- runFlow: common/sign-in.yaml

# ── A chooses Dark ──
- runFlow:
    file: common/pick-theme.yaml
    env:
      THEME_ID: dark

# ── a guest on the same phone chooses Light ──
- runFlow: common/ensure-signed-out.yaml
- runFlow:
    file: common/pick-theme.yaml
    env:
      THEME_ID: light

# ── A is back, and so is its Dark ──
- runFlow: common/ensure-signed-in.yaml
- runFlow:
    file: common/expect-theme.yaml
    env:
      THEME_ID: dark

# ── B signs in on a device left on A's Dark, and gets its own Light ──
- runFlow: common/ensure-signed-out.yaml
- tapOn:
    id: "profile-sign-in"
- runFlow:
    file: common/sign-in.yaml
    env:
      TEST_EMAIL: ${TEST_EMAIL_2}
      TEST_PASSWORD: ${TEST_PASSWORD_2}
- runFlow:
    file: common/expect-theme.yaml
    env:
      THEME_ID: light

# ── and A, after B, is Dark again — then home: Auto, signed out ──
- runFlow: common/ensure-signed-out.yaml
- runFlow: common/ensure-signed-in.yaml
- runFlow:
    file: common/expect-theme.yaml
    env:
      THEME_ID: dark
- runFlow:
    file: common/pick-theme.yaml
    env:
      THEME_ID: system
- runFlow: common/ensure-signed-out.yaml
