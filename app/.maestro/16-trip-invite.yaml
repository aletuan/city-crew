# Two run-owned accounts, already friends. Verify cascade with B still
# accepted, then a separate trip verifies B leaving and A seeing the answer.
appId: host.exp.Exponent
env:
  EXPO_URL: exp://127.0.0.1:8081
---
- runFlow: common/start.yaml
- runFlow: common/sign-in-trip-owner.yaml
- runFlow: common/assert-trips-empty.yaml
- runFlow: common/create-trip.yaml
- runFlow: common/invite-trip-guest.yaml
- runFlow: common/start.yaml
- runFlow: common/sign-in-trip-guest.yaml
- runFlow: common/accept-trip-invite.yaml

# A sees the accepted response, then deletes the only fixture trip.
- runFlow: common/start.yaml
- runFlow: common/sign-in-trip-owner.yaml
- tapOn:
    id: "tab-trips"
- extendedWaitUntil:
    visible:
      id: "trips-ready"
    timeout: 30000
- tapOn:
    id: "trip-upcoming-0"
- scrollUntilVisible:
    element:
      id: "crew-said-0"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible:
    id: "crew-said-0"
    text: "Coming"
- runFlow: common/start.yaml
- runFlow: common/sign-in-trip-owner.yaml
- tapOn:
    id: "tab-trips"
- runFlow: common/delete-first-trip.yaml
# Read both accounts after cold starts; neither stale UI nor an unchanged
# tab bar can satisfy the deletion check.
- runFlow: common/start.yaml
- runFlow: common/sign-in-trip-owner.yaml
- runFlow: common/assert-trips-empty.yaml
- runFlow: common/start.yaml
- runFlow: common/sign-in-trip-guest.yaml
- runFlow: common/assert-trips-empty.yaml

# Separate trip: B accepts, then leaves. No re-invite of an answered row
# (the app only withdraws unanswered invitations).
- runFlow: common/start.yaml
- runFlow: common/sign-in-trip-owner.yaml
- runFlow: common/assert-trips-empty.yaml
- runFlow: common/create-trip.yaml
- runFlow: common/invite-trip-guest.yaml
- runFlow: common/start.yaml
- runFlow: common/sign-in-trip-guest.yaml
- runFlow: common/accept-trip-invite.yaml
- tapOn:
    id: "trip-leave"
- tapOn:
    text: "Leave|Rời|抜ける|退出|離開"
- extendedWaitUntil:
    notVisible:
      id: "trip-leave"
    timeout: 30000
- runFlow: common/assert-trips-empty.yaml
- runFlow: common/start.yaml
- runFlow: common/sign-in-trip-guest.yaml
- runFlow: common/assert-trips-empty.yaml

# Leaving removes B's membership, not A's trip.
- runFlow: common/start.yaml
- runFlow: common/sign-in-trip-owner.yaml
- tapOn:
    id: "tab-trips"
- extendedWaitUntil:
    visible:
      id: "trips-ready"
    timeout: 30000
- tapOn:
    id: "trip-upcoming-0"
- scrollUntilVisible:
    element:
      id: "crew-said-0"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible:
    id: "crew-said-0"
    text: "Can’t make it"
- runFlow: common/start.yaml
- runFlow: common/sign-in-trip-owner.yaml
- tapOn:
    id: "tab-trips"
- runFlow: common/delete-first-trip.yaml
- runFlow: common/assert-trips-empty.yaml
- runFlow: common/ensure-signed-out.yaml
