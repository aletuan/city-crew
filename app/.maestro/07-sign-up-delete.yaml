# Lifecycle smoke: create a unique account without email verification,
# prove the session survives a cold start, delete it through the UI,
# and prove its credentials can no longer sign in.
# Run via smoke.sh: it supplies SIGNUP_* and cleans up even after failures.
appId: host.exp.Exponent
env:
  EXPO_URL: exp://127.0.0.1:8081
---
- runFlow: common/signup-ios-prep.yaml
- runFlow: common/start.yaml
- runFlow: common/ensure-signed-out.yaml
- tapOn:
    id: "profile-sign-in"
- extendedWaitUntil:
    visible:
      id: "signin-email"
    timeout: 15000
- tapOn:
    id: "signin-switch-signup"
- extendedWaitUntil:
    visible:
      id: "signup-name"
    timeout: 15000

# The form. The username is left alone: it is suggested from the name,
# and a collision falls back to a server-generated handle rather than
# failing the account into existence (see `handle_new_user`).
- tapOn:
    id: "signup-name"
- inputText: ${SIGNUP_NAME}
- tapOn:
    id: "signup-email"
- inputText: ${SIGNUP_EMAIL}
- tapOn:
    id: "signup-password"
- inputText: ${SIGNUP_PASSWORD}
# Finish the first field before focusing the second: the keyboard can
# move the form and consume the first tap, appending both inputs above.
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "signup-confirm"
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn:
    id: "signup-confirm"
- inputText: ${SIGNUP_PASSWORD}
- pressKey: Enter
- tapOn:
    text: "Not Now"
    optional: true

# Taste picker: skip it, the same real answer a reader who has not
# decided yet gets to give. TastePicker's grid can push "Skip for now"
# below the fold on a shorter simulator, and it sits at the very foot of
# the page under the Continue button — rule 9, not a plain wait.
- scrollUntilVisible:
    element:
      id: "signup-taste-skip"
    direction: DOWN
    timeout: 15000
- scroll
- tapOn:
    id: "signup-taste-skip"

# Welcome — the account exists and is signed in. Continuing leaves the
# sign-up stack and lands back on Profile, now rendering signed in. Same
# foot-of-page treatment: the plane art alone is 250pt tall, tight on an
# iPhone SE-sized simulator once the greeting and lede sit under it too.
- scrollUntilVisible:
    element:
      id: "signup-welcome-continue"
    direction: DOWN
    timeout: 20000
- scroll
- tapOn:
    id: "signup-welcome-continue"

# A real session exists immediately, without an emailed code.
- runFlow: common/start.yaml
- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element:
      id: "profile-sign-out"
    direction: DOWN
    centerElement: true
    timeout: 30000

# Delete it, from the same screen the persistent account's owner would
# use — see DeleteAccountScreen.tsx for why this is one screen and one
# button rather than a second confirmation. Reached via a mid-page tap on
# Profile, hence `centerElement` on this first hop only; both stops on
# DeleteAccountScreen itself are the two-card page's own foot and follow
# rule 9 instead.
- scrollUntilVisible:
    element:
      id: "profile-delete-account"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "profile-delete-account"
- extendedWaitUntil:
    visible:
      text: ${SIGNUP_NAME}
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "delete-account-confirm"
    direction: DOWN
    timeout: 15000
- scroll
- tapOn:
    id: "delete-account-confirm"

# Wait for deletion to leave this screen, then recover Profile's scroll
# position: its guest sign-in button is at the top, not the old footer.
- extendedWaitUntil:
    notVisible:
      id: "delete-account-confirm"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "profile-sign-in"
    direction: UP
    centerElement: true
    timeout: 20000

# Guest UI alone could also mean sign-out. The deleted account must be
# rejected by authentication, and remain a guest after another cold start.
- tapOn:
    id: "profile-sign-in"
- extendedWaitUntil:
    visible:
      id: "signin-email"
    timeout: 15000
- tapOn:
    id: "signin-email"
- inputText: ${SIGNUP_EMAIL}
- tapOn:
    id: "signin-password"
- inputText: ${SIGNUP_PASSWORD}
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "auth-error"
    timeout: 15000
- assertVisible:
    id: "signin-email"
- runFlow: common/start.yaml
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
      id: "profile-sign-in"
    timeout: 15000
