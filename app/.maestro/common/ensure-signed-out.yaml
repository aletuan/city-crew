# Reusable: be a guest, whatever the last run left. Ends on Profile.
appId: host.exp.Exponent
---
- tapOn:
    id: "tab-profile"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible:
        id: "profile-sign-in"
    commands:
      - scrollUntilVisible:
          element:
            id: "profile-sign-out"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "profile-sign-out"
      - extendedWaitUntil:
          visible:
            id: "profile-sign-in"
          timeout: 15000
