# Reusable: be a guest, whatever the last run left. Ends on Profile.
appId: host.exp.Exponent
---
- runFlow: open-account.yaml
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible:
        id: "profile-sign-in"
    commands:
      - scrollUntilVisible:
          element:
            id: "profile-sign-out"
          direction: DOWN
          centerElement: true
          timeout: 20000
      - tapOn:
          id: "profile-sign-out"
      # A retained scroll can leave Sign in under the status bar. First
      # find it, then pull the content down once more before the next tap.
      # Do not center it: at the top of GuestHub it is fully visible at
      # y=232 but cannot reach the viewport centre (17/19/20, 20 Nov).
      - scrollUntilVisible:
          element:
            id: "profile-sign-in"
          direction: UP
          timeout: 20000
      - swipe:
          direction: DOWN
      - assertVisible:
          id: "profile-sign-in"
