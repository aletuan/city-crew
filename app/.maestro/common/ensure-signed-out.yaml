# Reusable: be a guest, whatever the last run left. Ends on Profile.
appId: host.exp.Exponent
---
- tapOn:
    id: "tab-profile"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible:
        id: "profile-sign-in"
    commands:
      - scrollUntilVisible:
          element:
            id: "profile-sign-out"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "profile-sign-out"
      # Signing out swaps the page under a scroll position that was at the
      # bottom; the guest's button is at the top, and scrolling up also
      # brings back the tab bar the scroll down ducked.
      - scrollUntilVisible:
          element:
            id: "profile-sign-in"
          direction: UP
          timeout: 20000
