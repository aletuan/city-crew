# Expo Go quirk: its floating "Tools button" (a blue gear, id gearshape.fill)
# docks at the top-right corner — exactly over Explore's search button — so a
# tap on `explore-search` opens Expo's dev menu instead of Search. Switch it
# off once; Expo Go remembers the choice, so on later runs every step here is
# a no-op. The labels are Expo Go's own (English-only), not the app's.
#
# The switch only takes effect once the bundle reloads, which is why this
# taps "Reload" rather than "Close" and then waits for Explore to come back.
#
# Expo Go 57's menu (iOS 26) slides up a beat after the tap, and "Tools
# button" sits at the foot of its TOOLS list, below the fold. So: only when
# the gear is actually there (the switch is ON — tapping it can then only
# turn it OFF, never flip it back on), wait for the menu, scroll to the row,
# let the scroll settle, flip it, verify OFF, then scroll back up to Reload.
appId: host.exp.Exponent
---
- runFlow:
    when:
      visible:
        id: "gearshape.fill"
    commands:
      - tapOn:
          id: "gearshape.fill"
      - extendedWaitUntil:
          visible:
            text: "Reload"
          timeout: 10000
      - scrollUntilVisible:
          element:
            text: "Tools button"
          direction: DOWN
          timeout: 10000
      # The row can be visible while the menu is still moving. A tap then
      # can use stale switch coordinates (00-launch, 27 October).
      - waitForAnimationToEnd:
          timeout: 5000
      # rightOf alone also matches Fast refresh's switch above this row.
      # Restrict both the tap and the OFF check to below Fast refresh.
      - tapOn:
          text: "1"
          rightOf:
            text: "Tools button"
          below:
            text: "Fast refresh"
      # A completed tap is not proof that the switch changed. Verify its
      # value before Reload hides the menu and makes the cause ambiguous.
      - extendedWaitUntil:
          visible:
            text: "0"
            rightOf:
              text: "Tools button"
            below:
              text: "Fast refresh"
          timeout: 5000
      - scrollUntilVisible:
          element:
            text: "Reload"
          direction: UP
          timeout: 10000
      - tapOn:
          text: "Reload"
      - extendedWaitUntil:
          visible:
            id: "tab-explore"
          timeout: 90000
- runFlow: dismiss-welcome.yaml
- extendedWaitUntil:
    notVisible:
      id: "gearshape.fill"
    timeout: 15000
