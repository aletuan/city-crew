# Apple's review prompt can arrive after a successful save/check-in.
# The smoke simulator uses English system dialogs. Do not rate the app.
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible:
      text: "Not Now"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        text: "Not Now"
    commands:
      - tapOn:
          text: "Not Now"
      - extendedWaitUntil:
          notVisible:
            text: "Not Now"
          timeout: 5000
