appId: host.exp.Exponent
---
- tapOn:
    id: "tab-collections"
- extendedWaitUntil:
    visible:
      id: "collections-ready"
    timeout: 30000
- tapOn:
    id: "collections-yours"
- tapOn:
    text: ${FIXTURE_privacyTitle + '(,.*)?'}
- extendedWaitUntil:
    visible:
      id: "collection-visibility"
    timeout: 15000
