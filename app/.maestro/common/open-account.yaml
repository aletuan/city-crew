# Reusable: the last tab, and on it the Account page — where the settings,
# the email and Sign out are. Ends on Account signed in, on the guest's hub
# signed out.
#
# Since 19 Nov 2026 the tab opens your own person page, with Account a
# page over it ("Account ›" beside the activity heading;
# docs/profile-home-plan.md). A guest has no page of their own, so the
# tab still opens the hub, which is the page these flows want.
appId: host.exp.Exponent
---
- tapOn:
    id: "tab-profile"
# One of three pages, once it has loaded: the person page (found by
# handle, a spinner first), the guest's hub, or Account itself. The tab
# keeps its stack, so a flow that opened Account earlier — signing in
# does — finds Account still on top when it taps the tab again (19 Nov
# 2026: 05 and 06 failed in `ensure-signed-out` on exactly that).
- extendedWaitUntil:
    visible:
      id: "person-account|profile-sign-in|account-back"
    timeout: 15000
- runFlow:
    when:
      visible:
        id: "person-account"
    commands:
      - tapOn:
          id: "person-account"
      - extendedWaitUntil:
          visible:
            id: "account-back"
          timeout: 10000
