# Reusable: fill the Sign in screen with the test account and submit.
# Expects to start on that screen; ends on Profile, signed in.
#
# A sign-in with nothing waiting on it lands on Explore, not back on
# Profile (`leaveAuth` in nav.ts, since #1056): the reader who came for an
# account goes to the app's front door. A sign-in that a gesture asked for
# (save, like, plan…) goes back to that gesture's tab instead — none of the
# callers of this file start one, so Explore is the answer here. The flow
# checks it lands there, then walks to Profile, where every caller expects
# to be.
#
# TEST_EMAIL and TEST_PASSWORD come from `-e` on the command line — see
# README.md. They are never written into a flow.
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible:
      id: "signin-email"
    timeout: 15000
- tapOn:
    id: "signin-email"
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "signin-password"
- inputText: ${TEST_PASSWORD}
# The password field submits on return, and pressing it also drops the
# keyboard that would otherwise cover the button.
- pressKey: Enter
# iOS may offer to save the password. Its button is Apple's, not ours.
- tapOn:
    text: "Not Now"
    optional: true
# Explore keeps its scroll position, and a list scrolled down has ducked
# the tab bar (see lib/duck.ts): scrolling up brings the bar home before
# the tab can be read or tapped.
- scrollUntilVisible:
    element:
      id: "tab-explore"
    direction: UP
    timeout: 30000
- assertVisible:
    id: "tab-explore"
    selected: true
- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element:
      id: "profile-sign-out"
    direction: DOWN
    centerElement: true
    timeout: 30000
# Scrolling down ducked the tab bar (see lib/duck.ts), and every flow
# after this one moves between tabs. Scrolling back up brings it home.
- scrollUntilVisible:
    element:
      id: "tab-profile"
    direction: UP
    timeout: 20000
