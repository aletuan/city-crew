# Submit only: the caller must assert its expected destination.
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible:
      id: "signin-email"
    timeout: 15000
- tapOn:
    id: "signin-email"
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "signin-password"
- inputText: ${TEST_PASSWORD}
# The password field submits on return, and pressing it also drops the
# keyboard that would otherwise cover the button.
- pressKey: Enter
# iOS may offer to save the password. Its button is Apple's, not ours.
- tapOn:
    text: "Not Now"
    optional: true
