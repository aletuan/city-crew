# Reusable: open the first upcoming trip on the Trips tab and delete it.
# Expects the Trips tab to be showing `trip-upcoming-0`.
appId: host.exp.Exponent
---
- tapOn:
    id: "trip-upcoming-0"
- scrollUntilVisible:
    element:
      id: "trip-delete"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: "trip-delete"
# A system alert: its buttons carry no ids, so the label is matched in all
# three of the app's languages.
- tapOn:
    text: "Delete|Xoá|削除"
- extendedWaitUntil:
    visible:
      id: "tab-trips"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
