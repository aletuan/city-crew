# Delete the sole trip belonging to this run. Caller has verified TRIP_EMAIL.
# Never sweep a persistent account or a nonempty pre-run baseline.
appId: host.exp.Exponent
---
- assertTrue: ${new RegExp('^maestro-e2e-[0-9a-f-]+@example[.]com$').test(TRIP_EMAIL)}
- extendedWaitUntil:
    visible:
      id: "trips-ready"
    timeout: 30000
- assertNotVisible:
    id: "trip-upcoming-1"
- tapOn:
    id: "trip-upcoming-0"
- scrollUntilVisible:
    element:
      id: "trip-delete"
    direction: DOWN
    timeout: 20000
# At the foot of the page it cannot be centred, and the first frame it
# shows in can be under the floating tab bar: one more scroll lifts it.
- scroll
- tapOn:
    id: "trip-delete"
# A system alert: its buttons carry no ids, so the label is matched in all
# three of the app's languages.
- tapOn:
    text: "Delete|Xoá|削除"
# The tab bar also exists on detail. Wait for navigation and the server
# refresh, otherwise a cleanup loop can see and tap the deleted stale row.
- extendedWaitUntil:
    notVisible:
      id: "trip-delete"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "trips-ready"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
