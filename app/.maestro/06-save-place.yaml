# Save a place: bookmark the first place on Explore into the test account's
# first collection, see the bookmark fill, then take it out again.
#
# With no collection on the account, the first run makes one ("Maestro
# smoke") through the form the bookmark opens; later runs use the sheet.
appId: host.exp.Exponent
env:
  EXPO_URL: exp://127.0.0.1:8081
---
- runFlow: common/start.yaml
- runFlow: common/ensure-signed-in.yaml
- tapOn:
    id: "tab-explore"
- extendedWaitUntil:
    visible:
      id: "place-card-0"
    timeout: 30000
- tapOn:
    id: "place-card-0"
- extendedWaitUntil:
    visible:
      id: "detail-name"
    timeout: 20000

# A run that failed after saving left the place in the list; take it out
# first so the save below is a save and not an unsave.
- runFlow:
    when:
      visible:
        id: "detail-saved"
    commands:
      - tapOn:
          id: "detail-saved"
      - extendedWaitUntil:
          visible:
            id: "save-row-0"
          timeout: 15000
      - tapOn:
          id: "save-row-0"
      - tapOn:
          id: "save-done"
      - extendedWaitUntil:
          visible:
            id: "detail-save"
          timeout: 15000

# Save. An account with no list yet is sent to "New collection" with the
# place riding along, rather than to the sheet; the flow answers either,
# so the test account needs no setup by hand. The list made here is kept
# and becomes the sheet's first row on every later run.
- tapOn:
    id: "detail-save"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        id: "collection-name"
    commands:
      - tapOn:
          id: "collection-name"
      - inputText: "Maestro smoke"
      - hideKeyboard
      - tapOn:
          id: "collection-submit"
      # The form lands on the Collections tab; the place is still open
      # on top of Explore's stack.
      - extendedWaitUntil:
          visible:
            id: "tab-explore"
          timeout: 15000
      - tapOn:
          id: "tab-explore"
- runFlow:
    when:
      visible:
        id: "save-row-0"
    commands:
      - tapOn:
          id: "save-row-0"
      - tapOn:
          id: "save-done"
- extendedWaitUntil:
    visible:
      id: "detail-saved"
    timeout: 15000

# And unsave, so the list is as it was.
- tapOn:
    id: "detail-saved"
- extendedWaitUntil:
    visible:
      id: "save-row-0"
    timeout: 15000
- tapOn:
    id: "save-row-0"
- tapOn:
    id: "save-done"
- extendedWaitUntil:
    visible:
      id: "detail-save"
    timeout: 15000
- tapOn:
    id: "detail-back"

# Leave the app a guest, so the next run of the guest flows starts as one.
- runFlow: common/ensure-signed-out.yaml
