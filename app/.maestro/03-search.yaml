# Search: type a keyword, open the first hit, come back, empty the query, leave by Cancel.
appId: host.exp.Exponent
env:
  EXPO_URL: exp://127.0.0.1:8081
---
# Kill Expo Go first so every flow starts from a fresh bundle load on
# Explore, not from wherever the previous flow left the app.
- launchApp:
    stopApp: true
- openLink: ${EXPO_URL}
- extendedWaitUntil:
    visible:
      id: "tab-explore"
    timeout: 90000
- runFlow: common/dismiss-welcome.yaml
- runFlow: common/expo-go-prep.yaml
- tapOn:
    id: "tab-explore"
- extendedWaitUntil:
    visible:
      id: "explore-search"
    timeout: 30000
- tapOn:
    id: "explore-search"
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 10000
- tapOn:
    id: "search-input"
- inputText: "cafe"
# Finish text entry before looking for a place. Matching collections come
# first, so the first place may be off-screen even after the keyboard closes.
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "search-result-0"
    direction: DOWN
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "search-result-0"
- extendedWaitUntil:
    visible:
      id: "detail-name"
    timeout: 20000
- tapOn:
    id: "detail-back"
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 10000
# No (x) since 15 Oct 2026 — Cancel is the way out, and it leaves the
# screen. Emptying the words is the keyboard's job.
- tapOn:
    id: "search-input"
- eraseText: 20
- assertNotVisible:
    id: "search-result-0"
# Cancel, inside the box, leaves the search for the screen it came from.
- tapOn:
    id: "search-cancel"
- extendedWaitUntil:
    visible:
      id: "explore-list"
    timeout: 10000
