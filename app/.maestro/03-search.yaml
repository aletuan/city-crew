# Search: type a keyword, open the first hit, come back, clear the query.
appId: host.exp.Exponent
env:
  EXPO_URL: exp://127.0.0.1:8081
---
- launchApp:
    stopApp: false
- openLink: ${EXPO_URL}
- extendedWaitUntil:
    visible:
      id: "tab-explore"
    timeout: 90000
- runFlow: common/dismiss-welcome.yaml
- tapOn:
    id: "tab-explore"
- extendedWaitUntil:
    visible:
      id: "explore-search"
    timeout: 30000
- tapOn:
    id: "explore-search"
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 10000
- tapOn:
    id: "search-input"
- inputText: "cafe"
- extendedWaitUntil:
    visible:
      id: "search-result-0"
    timeout: 20000
- tapOn:
    id: "search-result-0"
- extendedWaitUntil:
    visible:
      id: "detail-name"
    timeout: 20000
- tapOn:
    id: "detail-back"
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 10000
- tapOn:
    id: "search-clear"
- assertNotVisible:
    id: "search-result-0"
